name: prodsuite

services:
  app:
    build:
      context: .
    image: prodsuite:1.0
    container_name: prodsuite
    restart: unless-stopped
    init: true
    ports:
      # Host 8090 -> container 5000 (Gunicorn).
      # BIND_ADDR permite expor apenas no IP Tailscale (100.x.y.z) ou só em
      # 127.0.0.1 quando o TLS é terminado por `tailscale serve`.
      - "${BIND_ADDR:-0.0.0.0}:${APP_PORT:-8090}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env (veja .env.example)}
      DATABASE_URL: sqlite:////data/prodsuite.db
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-30}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOGIN_ATTEMPT_LIMIT: ${LOGIN_ATTEMPT_LIMIT:-5}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-4}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      MALLOC_ARENA_MAX: "2"
    volumes:
      - prodsuite_data:/data
    # Endurecimento: rootfs imutável, somente /tmp e /data graváveis.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Teto de recursos (RNF01): a app + SQLite + OS cabem com folga.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3); sys.exit(0 if r.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  prodsuite_data:
    name: prodsuite_data
