[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prodsuite-tui"
version = "0.1.0b1"
description = "ProdSuite TUI beta — produtividade local no terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ProdSuite" }]
dependencies = ["textual>=1.0,<9"]

[project.scripts]
prodsuite-tui = "prodsuite_tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prodsuite_tui = ["app.tcss"]
