<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sem conexão · ProdSuite</title>
  <meta name="theme-color" content="#faf7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ProdSuite">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon-180.png') }}">
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
  <main class="app-main" style="max-width: 560px;">
    <div class="bento-card offline-box">
      <img class="brand-logo" src="{{ url_for('static', filename='icons/icon.svg') }}" alt="" width="38" height="38">
      <p class="eyebrow justify-content-center"><i class="bi bi-wifi-off"></i> sem internet</p>
      <h1>Sem conexão</h1>
      <p>
        Você está sem conexão. O app abriu, mas suas tarefas e notas precisam
        de internet para aparecer. Conecte-se de novo e tente outra vez.
      </p>
      <div class="d-flex gap-2 justify-content-center mt-3">
        <a class="btn btn-neon btn-sm" href="/">
          <i class="bi bi-arrow-clockwise"></i> Tentar novamente
        </a>
        <a class="btn btn-ghost btn-sm" href="/">Voltar ao início</a>
      </div>
    </div>
  </main>
</body>
</html>
